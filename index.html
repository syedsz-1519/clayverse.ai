    <!-- Instant Pre-Hydration Theme Initializer to Prevent Flash on Reload -->
    <script>
      (function() {
        try {
          var validThemes = ['sand', 'deep-blue', 'deep-night', 'red-light'];
          var theme = localStorage.getItem('clay_theme') || localStorage.getItem('app_theme') || localStorage.getItem('theme');
          if (theme && validThemes.indexOf(theme) !== -1) {
            document.documentElement.setAttribute('data-theme', theme);
          } else {
            document.documentElement.setAttribute('data-theme', 'sand');
          }
          var hc = localStorage.getItem('clay_high_contrast') || localStorage.getItem('app_high_contrast');
          if (hc === 'true') {
            document.documentElement.setAttribute('data-high-contrast', 'true');
            document.documentElement.classList.add('high-contrast');
          }
        } catch (e) {}
      })();
    </script>
